project:
  name: "textus-supervisor"
  title: "Textus Supervisor"
  kind: car
  organization: "org.textus"
  scalaPackage: "org.simplemodeling.textus.supervisor"
  component:
    name: "textus-supervisor"
    className: "TextusSupervisor"
    displayName: "Textus Supervisor"
    version: "0.1.0-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.1-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.1"
    test:
      - "org.scalatest::scalatest:3.2.10"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    runtime:
      cncf:
        minimum: "0.5.1"
        excluded: []
        tested:
          - "0.5.1"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-supervisor"
