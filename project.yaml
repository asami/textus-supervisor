project:
  namespace: "org.simplemodeling.textus"
  id: "Supervisor"
  name: "textus-supervisor"
  title: "Textus Supervisor"
  kind: car
  scalaPackage: "org.simplemodeling.textus.supervisor"
  component:
    name: "Supervisor"
    className: "SupervisorComponent"
    displayName: "Textus Supervisor"
    version: "0.1.1-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.2.2"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2"
    test:
      - "org.scalatest::scalatest:3.2.10"
      - "org.scalacheck::scalacheck:1.17.1"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "subsystem-operation"
      domain: "system-administration"
    runtime:
      cncf:
        minimum: "0.5.2"
        excluded: []
        tested:
          - "0.5.2"
          - "0.5.3-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-supervisor"
