project:
  namespace: "org.simplemodeling.textus"
  id: "Supervisor"
  title: "Textus Supervisor"
  kind: car
  component:
    displayName: "Textus Supervisor"
    version: "0.1.0-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.4-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.2-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.10"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    manifest_metadata:
      boundedContext: "subsystem-operation"
      domain: "system-administration"
    runtime:
      cncf:
        minimum: "0.5.2-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.2-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-supervisor"
